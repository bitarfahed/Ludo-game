[project]
name = "ludo"
version = "1.0"
description = "A playable local Python/Pygame desktop Ludo game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ludo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["ludo"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
